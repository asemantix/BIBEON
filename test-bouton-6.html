<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Test 6 — la fiche entière à notre charte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<script src="https://www.paypalobjects.com/ncp/cart/cart.js" data-merchant-id="FSYQHD6LCGE42"></script>
<style>
:root{--navy:#0E1C35;--paper:#fcfaf6;--line:#d8d4cc;--muted:#6e6a64;
      --terracotta:#b66a55;--terracotta-dark:#96503f}
body{margin:0;padding:48px 20px;background:var(--paper);color:var(--navy);
     font-family:"DM Sans",sans-serif}
main{max-width:520px;margin:0 auto}
.eyebrow{margin:0 0 18px;font-size:.65rem;text-transform:uppercase;letter-spacing:.18em;color:var(--terracotta-dark)}
h1{font:500 4rem/.9 "Playfair Display",Georgia,serif;letter-spacing:-.04em;margin:0 0 18px}
.prix{display:flex;align-items:baseline;gap:12px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.prix span{font-size:.72rem;color:var(--muted)}
.prix strong{font:500 2.1rem "Playfair Display",Georgia,serif}
.prix small{margin-left:auto;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.achat{margin-top:30px}

/* --- Bloc PayPal habillé à la charte --- */
paypal-add-to-cart-button .item-header{display:none!important}

paypal-add-to-cart-button .input-label{
  display:block!important;margin:0 0 9px!important;
  font:600 .6rem/1.4 "DM Sans",sans-serif!important;
  letter-spacing:.16em!important;text-transform:uppercase!important;
  color:var(--terracotta-dark)!important}

paypal-add-to-cart-button #memo-label,
paypal-add-to-cart-button #memo2-label{
  text-transform:none!important;letter-spacing:0!important;
  font:400 .82rem/1.5 "DM Sans",sans-serif!important;
  color:var(--muted)!important;margin:0 0 9px!important}

paypal-add-to-cart-button .variantContainer .fullWidth{margin:0 0 4px!important}
paypal-add-to-cart-button .selectContainer{margin:0 0 22px!important}

paypal-add-to-cart-button select{
  width:100%!important;box-sizing:border-box!important;
  appearance:none!important;-webkit-appearance:none!important;
  background-color:#fff!important;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%230E1C35' stroke-width='1.6'/></svg>")!important;
  background-repeat:no-repeat!important;
  background-position:right 16px center!important;
  border:1px solid var(--line)!important;border-radius:0!important;
  padding:15px 44px 15px 16px!important;
  font:400 .9rem/1.2 "DM Sans",sans-serif!important;color:var(--navy)!important;
  cursor:pointer!important}

paypal-add-to-cart-button textarea{
  width:100%!important;box-sizing:border-box!important;
  height:78px!important;min-height:78px!important;
  background:#fff!important;
  border:1px solid var(--line)!important;border-radius:0!important;
  padding:14px 16px!important;margin:0 0 22px!important;
  font:400 .9rem/1.5 "DM Sans",sans-serif!important;color:var(--navy)!important;
  resize:vertical!important}

paypal-add-to-cart-button select:focus,
paypal-add-to-cart-button textarea:focus{
  outline:2px solid var(--terracotta)!important;outline-offset:1px!important}

paypal-add-to-cart-button .error-label{
  margin:-14px 0 18px!important;
  font:400 .74rem/1.45 "DM Sans",sans-serif!important;color:#b3261e!important}
paypal-add-to-cart-button .error-label.hidden,
paypal-add-to-cart-button .hidden{display:none!important}

paypal-add-to-cart-button button.addToCartButtonContainer{
  width:100%!important;border:0!important;border-radius:0!important;
  background:var(--terracotta)!important;color:#fff!important;
  padding:19px 21px!important;
  font:600 .69rem/1 "DM Sans",sans-serif!important;
  letter-spacing:.13em!important;text-transform:uppercase!important;
  cursor:pointer!important;box-shadow:none!important;transition:background .2s!important}
paypal-add-to-cart-button button.addToCartButtonContainer:hover{
  background:var(--terracotta-dark)!important}


.apres{margin:26px 0 0;font:italic .84rem/1.5 "Playfair Display",Georgia,serif;color:var(--terracotta-dark)}
.rappel{margin:40px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <p class="eyebrow">La petite course · Un flacon</p>
  <h1>1 BIBEON</h1>
  <div class="prix"><span>Prix</span><strong>35 €</strong><small>Point relais offert</small></div>

  <div class="achat">
    <paypal-add-to-cart-button data-id="M3PTCD9U3FRS8"></paypal-add-to-cart-button>
    <script>cartPaypal.AddToCart({ id: "M3PTCD9U3FRS8" })</script>
    <p class="apres">À deux, le duo revient moins cher.</p>
  </div>

  <p class="rappel">Vraie fiche 1 BIBEON, avec ses menus et ses cases, habillée à la charte.</p>
</main>
</body>
</html>
