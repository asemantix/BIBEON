<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Test bouton PayPal — structure</title>
<script src="https://www.paypalobjects.com/ncp/cart/cart.js" data-merchant-id="FSYQHD6LCGE42"></script>
<style>
  body{margin:0;padding:40px 20px;background:#fff;
       font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#222}
  main{max-width:820px;margin:0 auto}
  h1{font-size:1.1rem;font-weight:600;margin:0 0 6px}
  p.note{margin:0 0 24px;color:#666;font-size:.9rem}
  .cadre{border:2px dashed #c00;padding:0;margin:0 0 28px}
  .cadre>legend{margin-left:12px;padding:0 6px;color:#c00;font-size:.72rem;
       letter-spacing:.08em;text-transform:uppercase}
  #verdict{font-weight:700;font-size:1.05rem;padding:12px 14px;border:2px solid #999;margin:0 0 16px}
  pre{background:#f4f4f4;border:1px solid #ddd;padding:14px;overflow:auto;
      font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;
      word-break:break-all;max-height:520px}
</style>
</head>
<body>
<main>
  <h1>Test 2 — de quoi le bloc est-il fait&nbsp;?</h1>
  <p class="note">Cette page ne change rien. Elle regarde l’intérieur du bloc PayPal et l’écrit ci-dessous. Attendez que la ligne encadrée passe au vert ou au rouge&nbsp;: elle se met à jour pendant dix secondes.</p>

  <fieldset class="cadre">
    <legend>bloc PayPal</legend>
    <paypal-add-to-cart-button data-id="XWRU956TPLXD4"></paypal-add-to-cart-button>
    <script>cartPaypal.AddToCart({ id: "XWRU956TPLXD4" })</script>
  </fieldset>

  <p id="verdict">Analyse… (patientez)</p>
  <pre id="sortie">…</pre>
</main>

<script>
(function(){
  var v = document.getElementById('verdict');
  var s = document.getElementById('sortie');
  var n = 0;

  function regarde(){
    n++;
    try {
      var el = document.querySelector('paypal-add-to-cart-button');
      if (!el) { v.textContent = 'Élément introuvable — ' + n; return false; }

      var ombre  = !!el.shadowRoot;
      var racine = ombre ? el.shadowRoot : el;
      var html   = racine.innerHTML || '';
      var iframe = !!racine.querySelector('iframe');
      var prete  = html.length > 0;

      s.textContent = 'shadowRoot : ' + (ombre ? 'oui' : 'non')
        + '\niframe : ' + (iframe ? 'oui' : 'non')
        + '\nlongueur du contenu : ' + html.length
        + '\nenfants directs : ' + racine.childElementCount
        + '\n\n' + (html ? html.slice(0, 3500) : '(vide)');

      if (!prete && n < 20) { v.textContent = 'Analyse… essai ' + n; return false; }

      if (ombre || iframe) {
        v.textContent = 'ROUGE — contenu enfermé (' + (ombre ? 'shadow DOM' : 'iframe') + '). Notre CSS ne peut pas le masquer.';
        v.style.cssText += ';color:#c00;border-color:#c00';
      } else {
        v.textContent = 'VERT — contenu ouvert. Notre CSS peut masquer le nom et le prix.';
        v.style.cssText += ';color:#0a5;border-color:#0a5';
      }
      return true;
    } catch (e) {
      v.textContent = 'Erreur : ' + e.message;
      v.style.cssText += ';color:#c00;border-color:#c00';
      return true;
    }
  }

  var t = setInterval(function(){
    if (regarde() || n >= 20) clearInterval(t);
  }, 500);
})();
</script>
</body>
</html>
