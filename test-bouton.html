<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Test bouton PayPal</title>
<script src="https://www.paypalobjects.com/ncp/cart/cart.js" data-merchant-id="FSYQHD6LCGE42"></script>
<style>
  body{margin:0;padding:40px 20px;background:#fff;
       font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#222}
  main{max-width:520px;margin:0 auto}
  h1{font-size:1.1rem;font-weight:600;margin:0 0 6px}
  p.note{margin:0 0 28px;color:#666;font-size:.9rem}
  .cadre{border:2px dashed #c00;padding:0;margin:0 0 28px}
  .cadre>legend{margin-left:12px;padding:0 6px;color:#c00;font-size:.72rem;
       letter-spacing:.08em;text-transform:uppercase}
  .panier{margin:0 0 32px}
</style>
</head>
<body>
<main>
  <h1>Test — ce que PayPal affiche réellement</h1>
  <p class="note">Le cadre rouge délimite le bloc fourni par PayPal. Tout ce qui est dedans vient d’eux&nbsp;; rien n’est de nous.</p>

  <div class="panier">
    <paypal-cart-button data-id="pp-view-cart"></paypal-cart-button>
    <script>cartPaypal.Cart({ id: "pp-view-cart" })</script>
  </div>

  <fieldset class="cadre">
    <legend>bloc PayPal</legend>
    <paypal-add-to-cart-button data-id="XWRU956TPLXD4"></paypal-add-to-cart-button>
    <script>cartPaypal.AddToCart({ id: "XWRU956TPLXD4" })</script>
  </fieldset>

  <p class="note">Page de test — à supprimer du dépôt une fois la réponse obtenue.</p>
</main>
</body>
</html>
