<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">La tétine vue de dessous : bien assise ou à reprendre</title>
  <desc id="d">À gauche, l’orifice de la tétine est rond et dégagé : elle est bien entrée dans sa base. À droite, un trait traverse l’orifice : la paroi de la tétine est repliée sur le côté.</desc>
  <rect width="720" height="400" fill="#FBF9F6"/>

  <!-- ═══ BIEN ASSISE ═══ -->
  <g transform="translate(190 180)" fill="none" stroke="#0E1C35" stroke-linecap="round" stroke-linejoin="round">
    <circle r="128" stroke-width="2"/>
    <circle r="44" fill="#0E1C35" fill-opacity=".07" stroke-width="2"/>
  </g>
  <g transform="translate(300 76)">
    <circle r="19" fill="#647466"/>
    <path d="M-8 1 l5 5 l11 -12" fill="none" stroke="#FBF9F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="190" y="352" text-anchor="middle" font-family="'Playfair Display',Georgia,serif" font-size="24" fill="#0E1C35">Bien assise</text>
  <text x="190" y="378" text-anchor="middle" font-family="'DM Sans',Arial,sans-serif" font-size="12" letter-spacing="2.2" fill="#647466">ORIFICE ROND ET DÉGAGÉ</text>

  <!-- ═══ À REPRENDRE ═══ -->
  <g transform="translate(530 180)" fill="none" stroke="#0E1C35" stroke-linecap="round" stroke-linejoin="round">
    <circle r="128" stroke-width="2"/>
    <ellipse rx="46" ry="40" fill="#0E1C35" fill-opacity=".07" stroke-width="2"/>
    <path d="M-50 -32 L 50 32" stroke="#96503F" stroke-width="3.2"/>
  </g>
  <g transform="translate(640 76)">
    <circle r="19" fill="#96503F"/>
    <path d="M-7 -7 L7 7 M7 -7 L-7 7" fill="none" stroke="#FBF9F6" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="530" y="352" text-anchor="middle" font-family="'Playfair Display',Georgia,serif" font-size="24" fill="#0E1C35">À reprendre</text>
  <text x="530" y="378" text-anchor="middle" font-family="'DM Sans',Arial,sans-serif" font-size="12" letter-spacing="2.2" fill="#96503F">UN TRAIT TRAVERSE L’ORIFICE</text>
</svg>
